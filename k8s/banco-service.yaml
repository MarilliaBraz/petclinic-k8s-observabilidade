# Atividade 4 - Plataforma de Monitoramento e Observabilidade
# Grupo: Marillia Braz, Lucas Mendes e Pedro Henrique Feitosa
#
# Service interno (ClusterIP) do banco. Nao e exposto fora do cluster: so a
# aplicacao e o postgres-exporter acessam o PostgreSQL, pelo nome
# banco-service.petclinic.svc na porta 5432.
apiVersion: v1
kind: Service
metadata:
  name: banco-service
  namespace: petclinic
  labels:
    app.kubernetes.io/name: banco
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: petclinic
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: banco
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
