# Atividade 4 - Plataforma de Monitoramento e Observabilidade
# Grupo: Marillia Braz, Lucas Mendes e Pedro Henrique Feitosa
#
# postgres-exporter: transforma as estatisticas do PostgreSQL (conexoes,
# transacoes, tamanho do banco, consultas) em metricas do Prometheus.
# Instalado no namespace petclinic, junto do banco, e usa a conta
# "monitoramento" (papel pg_monitor, somente leitura de estatisticas).
fullnameOverride: banco-exporter

config:
  datasource:
    host: banco-service.petclinic.svc
    port: "5432"
    database: petclinic
    user: monitoramento
    passwordSecret:
      name: banco-credenciais
      key: BANCO_MONITORAMENTO_SENHA
    sslmode: disable

serviceMonitor:
  enabled: true
  interval: 30s

resources:
  requests:
    cpu: 20m
    memory: 32Mi
  limits:
    memory: 64Mi
