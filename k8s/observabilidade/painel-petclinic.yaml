# Atividade 4 - Plataforma de Monitoramento e Observabilidade
# Grupo: Marillia Braz, Lucas Mendes e Pedro Henrique Feitosa
#
# Painel do Grafana com metricas (Prometheus), logs (Loki) e traces (Tempo)
# da aplicacao. O Grafana carrega sozinho todo ConfigMap com o rotulo
# grafana_dashboard. Arquivo gerado por scripts/painel/gerar-painel.py:
# altere o script, nao este arquivo.
apiVersion: v1
kind: ConfigMap
metadata:
  name: painel-petclinic
  namespace: observabilidade
  labels:
    grafana_dashboard: "1"
data:
  petclinic.json: |
    {
      "uid": "petclinic-observabilidade",
      "title": "PetClinic: métricas, logs e traces",
      "tags": [
        "petclinic",
        "atividade-4"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "10s",
      "time": {
        "from": "now-15m",
        "to": "now"
      },
      "panels": [
        {
          "type": "row",
          "title": "Métricas (Prometheus)",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          },
          "id": 1
        },
        {
          "type": "stat",
          "title": "Réplicas da aplicação prontas",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(kube_deployment_status_replicas_available{namespace=\"petclinic\",deployment=\"petclinic\"})"
            }
          ],
          "id": 2
        },
        {
          "type": "stat",
          "title": "Banco de dados pronto",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 4,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(kube_statefulset_status_replicas_ready{namespace=\"petclinic\",statefulset=\"banco\"})"
            }
          ],
          "id": 3
        },
        {
          "type": "stat",
          "title": "Requisições por segundo",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 8,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "decimals": 2
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(http_server_request_duration_seconds_count{service_name=\"petclinic\",http_route!~\"/actuator.*\"}[1m]))"
            }
          ],
          "id": 4
        },
        {
          "type": "stat",
          "title": "Erros (5xx)",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 2
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(http_server_request_duration_seconds_count{service_name=\"petclinic\",http_route!~\"/actuator.*\",http_response_status_code=~\"5..\"}[5m])) / sum(rate(http_server_request_duration_seconds_count{service_name=\"petclinic\",http_route!~\"/actuator.*\"}[5m]))"
            }
          ],
          "id": 5
        },
        {
          "type": "stat",
          "title": "Latência p95",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 16,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "decimals": 2
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket{service_name=\"petclinic\",http_route!~\"/actuator.*\"}[5m])))"
            }
          ],
          "id": 6
        },
        {
          "type": "stat",
          "title": "Conexões no banco",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 20,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(pg_stat_activity_count{datname=\"petclinic\"})"
            }
          ],
          "id": 7
        },
        {
          "type": "timeseries",
          "title": "Requisições por réplica (balanceamento de carga)",
          "description": "Cada linha é uma réplica. Linhas próximas mostram o Service dividindo a carga.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 5,
            "w": 8,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "fillOpacity": 10
              }
            }
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (k8s_pod_name) (rate(http_server_request_duration_seconds_count{service_name=\"petclinic\",http_route!~\"/actuator.*\"}[1m]))",
              "legendFormat": "{{k8s_pod_name}}"
            }
          ],
          "id": 8
        },
        {
          "type": "timeseries",
          "title": "CPU por pod",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 8,
            "y": 5,
            "w": 8,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "cores",
              "custom": {
                "fillOpacity": 10
              }
            }
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"petclinic\",container!=\"\"}[2m]))",
              "legendFormat": "{{pod}}"
            }
          ],
          "id": 9
        },
        {
          "type": "timeseries",
          "title": "Memória por pod",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 16,
            "y": 5,
            "w": 8,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "fillOpacity": 10
              }
            }
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"petclinic\",container!=\"\"})",
              "legendFormat": "{{pod}}"
            }
          ],
          "id": 10
        },
        {
          "type": "row",
          "title": "Logs (Loki)",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 13,
            "w": 24,
            "h": 1
          },
          "id": 11
        },
        {
          "type": "logs",
          "title": "Logs da aplicação (clique no trace_id para abrir o trace)",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "x": 0,
            "y": 14,
            "w": 14,
            "h": 10
          },
          "options": {
            "showTime": true,
            "wrapLogMessage": true,
            "sortOrder": "Descending",
            "enableLogDetails": true
          },
          "targets": [
            {
              "refId": "A",
              "expr": "{k8s_namespace_name=\"petclinic\", k8s_container_name=\"petclinic\"} != \"/actuator/health\" != \"Completed 200 OK\"",
              "queryType": "range"
            }
          ],
          "id": 12
        },
        {
          "type": "logs",
          "title": "Logs do banco de dados (INSERT, UPDATE, DELETE)",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "x": 14,
            "y": 14,
            "w": 10,
            "h": 10
          },
          "options": {
            "showTime": true,
            "wrapLogMessage": true,
            "sortOrder": "Descending",
            "enableLogDetails": true
          },
          "targets": [
            {
              "refId": "A",
              "expr": "{k8s_namespace_name=\"petclinic\", k8s_container_name=\"postgres\"} |~ \"(?i)insert into|update |delete from|error|fatal\"",
              "queryType": "range"
            }
          ],
          "id": 13
        },
        {
          "type": "logs",
          "title": "Logs da aplicação coletados pelo Promtail (PLG)",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "x": 0,
            "y": 24,
            "w": 24,
            "h": 8
          },
          "options": {
            "showTime": true,
            "wrapLogMessage": true,
            "sortOrder": "Descending",
            "enableLogDetails": true
          },
          "targets": [
            {
              "refId": "A",
              "expr": "{coletor=\"promtail\", namespace=\"petclinic\", container=\"petclinic\"} != \"/actuator/health\" != \"Completed 200 OK\"",
              "queryType": "range"
            }
          ],
          "id": 14
        },
        {
          "type": "row",
          "title": "Traces (Tempo)",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 32,
            "w": 24,
            "h": 1
          },
          "id": 15
        },
        {
          "type": "table",
          "title": "Últimas requisições rastreadas (clique no trace)",
          "datasource": {
            "type": "tempo",
            "uid": "tempo"
          },
          "gridPos": {
            "x": 0,
            "y": 33,
            "w": 14,
            "h": 10
          },
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "nested": true
                }
              }
            }
          ],
          "targets": [
            {
              "refId": "A",
              "queryType": "traceql",
              "limit": 20,
              "query": "{resource.service.name=\"petclinic\" && span.http.route != \"\" && span.http.route !~ \"/actuator.*\"}"
            }
          ],
          "id": 16
        },
        {
          "type": "nodeGraph",
          "title": "Mapa de serviços (gerado a partir dos traces)",
          "datasource": {
            "type": "tempo",
            "uid": "tempo"
          },
          "gridPos": {
            "x": 14,
            "y": 33,
            "w": 10,
            "h": 10
          },
          "targets": [
            {
              "refId": "A",
              "queryType": "serviceMap"
            }
          ],
          "id": 17
        }
      ]
    }
